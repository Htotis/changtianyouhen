<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>加载中 — 书架</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-home">

<header class="topbar">
  <div class="wrap topbar__inner">

    <span class="topbar__btn" id="crumbBook" style="pointer-events:none"></span>

<main class="wrap" id="bookMain">

    <div class="cover">
      <h1 class="cover__title" id="coverTitle">…</h1>
      <span class="cover__seal" id="coverSeal">…</span>
    </div>

    <div class="info">
      <h1 class="info__title" id="bookTitle">加载中</h1>
      <div class="info__meta" id="bookMeta"></div>
      <div class="tagrow" id="bookTags"></div>
      <div class="intro" id="bookIntro"></div>

      <div class="actions">
        <a class="btn btn--primary" id="startBtn" href="#">开始阅读</a>
        <a class="btn btn--ghost" id="continueBtn" href="#" hidden>继续阅读</a>
      </div>
    </div>
  </section>

  <div class="stats" id="stats"></div>

  <section id="toc">
    <div class="section-head">
      <h2>章节目录</h2>
      <span class="section-head__count" id="tocCount"></span>
    </div>
    <div class="toc" id="tocList"></div>
  </section>

</main>

<footer class="footer">
  <div class="wrap">
    <strong>书架</strong> · 在线阅读<br>
    本站内容为原创作品，未经许可请勿转载。<br>
